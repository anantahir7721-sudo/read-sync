name: Build Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package PageStreak APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded project debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK (when release keystore secrets are configured)
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not set; skipping release APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APK outputs
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/PageStreak-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apks/PageStreak-release.apk
          fi
          ls -lh dist-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageStreak-APK-${{ github.run_number }}
          path: dist-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (main/master/tags)
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TITLE="PageStreak ${TAG_NAME}"
            NOTES="Automated APK build for tag ${TAG_NAME} (commit ${GITHUB_SHA::7})."
            if gh release view "$TAG_NAME" > /dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist-apks/*.apk --clobber
            else
              gh release create "$TAG_NAME" dist-apks/*.apk \
                --title "$TITLE" \
                --notes "$NOTES"
            fi
          else
            TAG_NAME="latest"
            TITLE="PageStreak Latest Build"
            NOTES="Automated APK build from \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7})."
            if gh release view "$TAG_NAME" > /dev/null 2>&1; then
              gh release edit "$TAG_NAME" --title "$TITLE" --notes "$NOTES"
              gh release upload "$TAG_NAME" dist-apks/*.apk --clobber
            else
              gh release create "$TAG_NAME" dist-apks/*.apk \
                --title "$TITLE" \
                --notes "$NOTES" \
                --target "$GITHUB_SHA" \
                --prerelease
            fi
          fi
